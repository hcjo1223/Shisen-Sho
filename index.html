<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>말랑 사천성 — 귀여운 이모지 사천성 퍼즐</title>
  <meta name="description" content="과일과 동물 이모지로 즐기는 힐링 사천성 퍼즐. 같은 그림 두 개를 두 번 이하로 꺾인 선으로 이어 모두 없애 보세요.">
  <meta name="theme-color" content="#fff4ef">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261112">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="logo"><span class="logo-emoji" aria-hidden="true">🍓</span>말랑 사천성</h1>

      <div class="stats" aria-live="polite">
        <div class="stat"><span class="stat-label">남은 타일</span><span class="stat-value" id="stat-remaining">0</span></div>
        <div class="stat"><span class="stat-label">시간</span><span class="stat-value" id="stat-time">00:00</span></div>
        <div class="stat"><span class="stat-label">최고 기록</span><span class="stat-value" id="stat-best">--:--</span></div>
      </div>

      <div class="settings">
        <label class="select-wrap" for="select-difficulty">
          <span class="sr-only">난이도</span>
          <select id="select-difficulty">
            <option value="easy" selected>🌱 쉬움 (48개)</option>
            <option value="normal">🌸 보통 (80개)</option>
            <option value="hard">👑 어려움 (112개)</option>
          </select>
        </label>
        <label class="select-wrap" for="select-theme">
          <span class="sr-only">테마</span>
          <select id="select-theme"></select>
        </label>
        <button class="icon-btn" id="btn-bgm" type="button" aria-label="배경음악 켜기/끄기" aria-pressed="false" title="배경음악">🎵</button>
        <button class="icon-btn" id="btn-sound" type="button" aria-label="효과음 켜기/끄기" aria-pressed="true" title="효과음">🔊</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="board-frame" id="board-frame">
        <div class="board" id="board" role="grid" aria-label="사천성 보드"></div>
        <svg class="path-layer" id="path-layer" aria-hidden="true"></svg>
        <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
      </div>
      <div class="combo" id="combo" aria-live="polite"></div>
    </main>

    <nav class="toolbar" aria-label="게임 도구">
      <button class="tool-btn" id="btn-hint" type="button"><span class="tool-icon">💡</span><span>힌트</span><span class="btn-badge" id="badge-hint">5</span></button>
      <button class="tool-btn" id="btn-shuffle" type="button"><span class="tool-icon">🔀</span><span>섞기</span><span class="btn-badge" id="badge-shuffle">1</span></button>
      <button class="tool-btn primary" id="btn-new" type="button"><span class="tool-icon">✨</span><span>새 게임</span></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="clear-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <div class="modal-emoji" id="clear-emoji">🎉</div>
      <h2 id="clear-title">모두 맞췄어요!</h2>
      <p class="modal-text" id="clear-text"></p>
      <div class="modal-actions">
        <button class="tool-btn primary" id="btn-again" type="button"><span class="tool-icon">✨</span><span>한 판 더</span></button>
      </div>
    </div>
  </div>

  <script src="js/themes.js?v=20261112"></script>
  <script src="js/pathfinder.js?v=20261112"></script>
  <script src="js/board.js?v=20261112"></script>
  <script src="js/sound.js?v=20261112"></script>
  <script src="js/renderer.js?v=20261112"></script>
  <script src="js/main.js?v=20261112"></script>
</body>
</html>
